<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recupero password · Smart Community</title>
  <link rel="stylesheet" href="site.css">
</head>
<body class="login-page">
  <div class="login-split">
    <aside class="login-side">
      <a class="brand" href="index.html"><span class="logo" aria-hidden="true">▣</span> Smart Community</a>
      <div>
        <h2>Hai dimenticato la password?</h2>
        <p>Scrivi l’email con cui ti sei registrata e ti spieghiamo come reimpostarla.</p>
      </div>
      <a class="back-home" href="index.html">⇦ Torna alla home</a>
    </aside>

    <main class="login-main">
      <div class="login-card">
        <h1>Recupera la password</h1>
        <p>Inserisci la tua email.</p>

        <form id="rec-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" placeholder="nome@esempio.it" aria-describedby="email-err">
            <div class="error" id="email-err" role="alert"></div>
          </div>
          <button class="btn" type="submit">Invia istruzioni</button>
        </form>
        <p class="ok-msg" id="ok-msg" role="status" hidden></p>

        <p class="switch"><a href="login.html">⇦ Torna al login</a></p>
        <p class="demo-note">Recupero dimostrativo: non viene inviata nessuna email.</p>
      </div>
    </main>
  </div>
  <script src="recupero.js"></script>
</body>
</html>
